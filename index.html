<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bezier View</title>
    </head>
    <body>
        <div id="container"></div>
        <input id="fileInput" type="file" style="visibility:hidden;position: absolute;" />
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                  "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
                  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
                  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"
                }
              }
        </script>
        <!-- <script type="module" src = "stateManager.js"></script> -->
        <script type="module">
            // TESTING: remove this
            const mode = 'old';

            import * as THREE from 'three/webgpu';
            import {globalState, setupGui, loadFile, gui} from './stateManager.js';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { BvPatch } from './BvPatch.js';
            import {BvLoader} from './BvLoader.js';
            let camera, scene, renderer, light, controls, time = 0;
            let bvFile; // holds the full file that was loaded, not just one patch
            const timer = new THREE.Timer();
            function init() {
                // File loader
                // document.getElementById('fileInput').addEventListener('change', (event) => {
                //     loadFile(event.target.files[0])
                // });
                // GUI

                setupGui();

                // CAMERA

                camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 10000 );
                camera.position.set( - 5, 5, 5 );

                // SCENE

                scene = new THREE.Scene();
                scene.background = new THREE.Color( 0xeeeeee );

                const gridHelper = new THREE.PolarGridHelper(2, 16);
                scene.add(gridHelper);

                // LIGHTS

                light = new THREE.DirectionalLight( 0xffffff, 5 );
                light.position.set( 0.5, 1, 0.5 );
                scene.add( light );

                // RENDERER

                renderer = new THREE.WebGPURenderer({ trackTimestamp: true });
                renderer.init();

                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animate);
                container.appendChild(renderer.domElement);

                // CONTROLS

                controls = new OrbitControls(camera, renderer.domElement);

                // EVENTS

                window.addEventListener('resize', onWindowResize);

                // File loader
                const bvLoader = new BvLoader(THREE.DefaultLoadingManager, renderer);
                let chooseModelHandle = gui.children[0].children[0];

                document.getElementById('fileInput').addEventListener('change', (event) => {
                    loadBVFile(event);
                });

                function loadBVFile(event) {
                    const file = event.target.files[0];

                    if (!file) {
                        console.log("Error loading file");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        console.log("file loaded");

                        // remove the old model (if there is one) and clean up
                        if (bvFile) {
                            scene.remove(bvFile);
                            for (const group of bvFile.children) {
                                for (const patch of group.children) {
                                    patch.geometry.dispose()
                                    patch.material.dispose()
                                }
                            }
                        }

                        // (this is just the file's text)
                        const text = event.target.result;

                        if (mode === 'new') {
                            bvFile = bvLoader.parseNew(text);

                            // set initial level
                            // for (const bvGroup of bvFile.children) {
                            //     bvGroup.setLevel(2);
                            // }
                        } else {
                            bvFile = bvLoader.parse(text);
                        }
                        scene.add(bvFile);

                        // TODO: update the GUI now that a new model has been loaded (groups section, etc)
                    }
                    reader.readAsText(file);


                }

                //Test
                let init_level = 2
                gui.add({'level': init_level}, 'level', 0, 6, 1).name('Patch Level').onChange((value) => {
                    console.log(`Setting level to: ${value}`)

                    if (mode === 'new') {
                        const newLevel = value; // TODO: (want to rename)
                        for (const bvGroup of bvFile.children) {
                            bvGroup.setLevel(newLevel);
                        }
                    } else {
                        // console.time('change tessellation level')
                        const all_passes = []
                        for (const group of bvFile.children) {
                            for (const patch of group.children) {
                                all_passes.push(...patch.getLevelPasses(value))
                                // patch.setLevelAwait(value);
                            }
                        }
                        if (all_passes.length !== 0)
                            renderer.compute(all_passes);
                        // console.timeEnd('change tessellation level');
                    }
                });
                /*
                gui.add({'level': 1}, 'level', 0, 6, 1).name('Patch Level').onChange(async (value) => {
                    console.time('change patch level');
                    bvFile.setLevel(value).then(() => console.timeEnd('change patch level'));

                    // bvFile.needsUpdate = true;
                });
                 */

            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                render();
            }

            function render() {
                // console.time('render');
                timer.update()
                const delta = timer.getDelta();
                time += delta;
                // render
                renderer.render( scene, camera );
                // console.timeEnd('render');
            }

            init();
        </script>
    </body>
</html>
