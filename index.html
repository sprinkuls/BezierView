<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bezier View</title>
        <!-- prefetch the default model that will be displayed on application startup -->
        <link rel="preload" href="/data/5/logo.bv" as="fetch" crossorigin>
    </head>
    <body>
        <div id="container"></div>
        <input id="fileInput" type="file" style="visibility:hidden;position: absolute;" />
        <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        </style>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"
            }
        }
        </script>
        <!-- <script type="module" src = "stateManager.js"></script> -->
        <script type="module">
        import * as THREE from 'three/webgpu';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import {state, setupGui, setGuiModel} from './stateManager.js';
        import {BvLoader} from './BvLoader.js';

        let camera, scene, renderer, light1, light2, light3, controls, time = 0;
        const timer = new THREE.Timer();
        let gui;

        // holds the full file that was loaded, not just one patch. this is a THREE group
        // that contains BvGroup objects for each "Group" listed in the .bv file
        let bvFile;

        // TODO: much of this state is tied to what the default GUI settings are
        // (e.g., if a light is turned on/off by default), but that connection
        // isn't anywhere in code. maybe export a "default options" object
        // in stateManager and then, based on those options, either turn these things
        // on or off?
        async function init() {

            // ==================== Camera ====================
            camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 10000 );
            camera.position.set( - 5, 5, 5 );


            // ==================== Scene ====================
            scene = new THREE.Scene();
            // scene.background = new THREE.Color( 0xeeeeee );
            scene.background = new THREE.Color( 0x333333 );
            const gridHelper = new THREE.PolarGridHelper(2, 16);
            scene.add(gridHelper);


            // ==================== Lights ====================
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight)

            light1 = new THREE.DirectionalLight( 0xffffff, 5 );
            light1.position.set( 1, 1, 1 );
            scene.add( light1 );

            light2 = new THREE.DirectionalLight( 0xffffff, 0 );
            light2.position.set( -1.41, 1, 0 );
            scene.add( light2 );

            light3 = new THREE.DirectionalLight( 0xffffff, 0 );
            light3.position.set( 1, 1, -1 );
            scene.add( light3 );

            // ==================== Renderer ====================
            renderer = new THREE.WebGPURenderer({ trackTimestamp: true, antialias: true });
            await renderer.init();

            if (renderer.backend.isWebGPUBackend === false){
                throw new Error('WebGPU is not supported by your browser');
            }

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            container.appendChild(renderer.domElement);

            // ==================== Controls ====================
            controls = new OrbitControls(camera, renderer.domElement);
            //TESTING: remove this
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;

            // ==================== Events ====================
            window.addEventListener('resize', onWindowResize);

            // ==================== Default Model ====================
            const response = await fetch('data/5/logo.bv');
            const text = await response.text();
            const bvLoader = new BvLoader(THREE.DefaultLoadingManager, renderer);
            bvFile = bvLoader.parse(text);
            scene.add(bvFile);

            // ==================== GUI ====================
            gui = setupGui({
                scene: scene,
                renderer: renderer,
                light1: light1,
                light2: light2,
                light3: light3,
                initBvFile: bvFile
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( window.innerWidth, window.innerHeight );
        }

        function animate() {
            render();
        }

        // TESTING: remove this
        let count = 3;
        function render() {
            count--;
            if (count === 0) {
                console.log("AH!");
                for (const bvGroup of bvFile.children) {
                    bvGroup.setLevel(2);
                }
            }
            timer.update()
            const delta = timer.getDelta();
            time += delta;

            // TESTING: remove this
            controls.update();

            // render
            renderer.resolveTimestampsAsync( THREE.TimestampQuery.RENDER );
            renderer.render( scene, camera );
        }

        init();
        </script>
    </body>
</html>
